name: kyokai_mobile
description: "Kyokai controller for Android phones, tablets and foldables"
publish_to: 'none'

version: 0.1.2+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared theme and adaptive layout, pinned by the MyApps-UI submodule.
  myapps_ui:
    path: packages/myapps_ui/packages/myapps_ui
  myapps_adaptive:
    path: packages/myapps_ui/packages/myapps_adaptive
  ffi: ^2.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  share_plus: ^10.0.0
  dynamic_color: ^1.7.0
  intl: ^0.20.2
  xterm: ^4.0.0
  file_picker: 10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
